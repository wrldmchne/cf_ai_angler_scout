<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ANGLER SCOUT</title>
	<style>
		:root {
			--bg-main: #0e0e0e;
			--bg-panel: #171717;
			--accent: #61ff9f;
			--text-primary: #ffffff;
			--text-body: #c4c7c5;
			--border: #2b2b2b;
		}

		body {
			background: var(--bg-main);
			color: var(--text-body);
			font-family: 'Inter', sans-serif;
			margin: 0;
			display: flex;
			flex-direction: column;
			height: 100vh;
			overflow: hidden;
		}

		header {
			padding: 80px 20px;
			flex-shrink: 0;
			display: flex;
			flex-direction: column;
			align-items: center;
			transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
		}

		header.active {
			padding: 15px 20px;
			order: 2;
			border-top: 1px solid var(--border);
			background: #0a0a0a;
		}

		.search-container {
			width: 100%;
			max-width: 800px;
			position: relative;
		}

		input {
			width: 100%;
			padding: 18px 120px 18px 25px;
			background: var(--bg-panel);
			border: 1px solid var(--border);
			border-radius: 32px;
			color: #fff;
			outline: none;
			box-sizing: border-box;
			font-size: 1rem;
		}

		input:focus {
			border-color: var(--accent);
			box-shadow: 0 0 15px rgba(97, 255, 159, 0.15);
		}

		button {
			position: absolute;
			right: 8px;
			top: 50%;
			transform: translateY(-50%);
			background: var(--accent);
			border: none;
			padding: 10px 22px;
			border-radius: 24px;
			font-weight: 600;
			cursor: pointer;
		}

		main {
			flex: 1;
			overflow-y: auto;
			padding: 20px;
			display: flex;
			flex-direction: column;
			align-items: center;
			order: 1;
		}

		#chips {
			display: none;
			gap: 8px;
			margin-bottom: 12px;
			flex-wrap: wrap;
			justify-content: center;
			width: 100%;
			max-width: 800px;
		}

		.chip {
			background: var(--bg-panel);
			border: 1px solid var(--border);
			padding: 7px 15px;
			border-radius: 20px;
			font-size: 0.8rem;
			cursor: pointer;
			transition: 0.2s;
		}

		.chip:hover {
			border-color: var(--accent);
			color: var(--accent);
		}

		.report-card {
			width: 100%;
			max-width: 800px;
			background: var(--bg-panel);
			border-radius: 28px;
			padding: 45px;
			box-sizing: border-box;
			margin-bottom: 25px;
			line-height: 1.8;
			border: 1px solid var(--border);
			animation: slideUp 0.5s ease;
		}

		h2 {
			color: var(--text-primary);
			margin: 0 0 25px 0;
			font-weight: 500;
		}

		b {
			color: var(--accent);
			font-weight: 500;
		}

		@keyframes slideUp {
			from {
				opacity: 0;
				transform: translateY(20px);
			}

			to {
				opacity: 1;
				transform: translateY(0);
			}
		}
	</style>
</head>

<body>
	<main id="out"></main>
	<header id="app-header">
		<div id="chips">
			<div class="chip" onclick="q('Best lures for this spot?')">Recommended Lures</div>
			<div class="chip" onclick="q('What time of day is best?')">Optimal Timing</div>
			<div class="chip" onclick="q('Any nearby access points?')">Access Points</div>
		</div>
		<div class="search-container">
			<form id="scout-form">
				<input type="text" id="user-query" placeholder="Enter location for tactical scout..." required
					autocomplete="off">
				<button type="submit" id="scout-btn">Scout</button>
			</form>
		</div>
	</header>

	<script>
		const out = document.getElementById('out');
		const header = document.getElementById('app-header');
		const chips = document.getElementById('chips');
		let history = [];

		function q(text) { document.getElementById('user-query').value = text; document.getElementById('scout-form').requestSubmit(); }

		document.getElementById('scout-form').onsubmit = async (e) => {
			e.preventDefault();
			const input = document.getElementById('user-query');
			const query = input.value.trim();
			if (!query) return;

			header.classList.add('active');
			chips.style.display = 'flex';
			history.push({ role: "user", content: query });

			// Update Geographic Anchor if the query isn't a question
			if (!query.includes('?')) fetch(`/api/anchor?loc=${encodeURIComponent(query)}`);

			const res = await fetch('/api/chat', { method: 'POST', body: JSON.stringify({ messages: history }) });
			const reader = res.body.getReader();
			const decoder = new TextDecoder();
			const card = document.createElement('div');
			card.className = 'report-card';
			out.appendChild(card);
			card.scrollIntoView({ behavior: 'smooth' });

			let fullText = "";
			while (true) {
				const { done, value } = await reader.read();
				if (done) break;
				const chunk = decoder.decode(value);
				const lines = chunk.split('\n');
				for (const line of lines) {
					if (line.startsWith('data: ') && !line.includes('[DONE]')) {
						const data = JSON.parse(line.slice(6));
						fullText += data.response;
						card.innerHTML = fullText.replace(/^## (.*$)/gm, '<h2>$1</h2>').replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
					}
				}
			}
			history.push({ role: "assistant", content: fullText });
			input.value = '';
		};
	</script>
</body>

</html>
