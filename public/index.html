<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>AI Fishing Guru 🎣</title>
	<style>
		body {
			font-family: -apple-system, system-ui, sans-serif;
			background: #121212;
			color: #e0e0e0;
			max-width: 600px;
			margin: 40px auto;
			padding: 20px;
		}

		.container {
			background: #1e1e1e;
			padding: 20px;
			border-radius: 12px;
			border: 1px solid #333;
			box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
		}

		h1 {
			color: #4dabf7;
			margin-top: 0;
		}

		.input-group {
			margin-bottom: 15px;
		}

		label {
			display: block;
			margin-bottom: 5px;
			font-size: 0.9em;
			color: #aaa;
		}

		input {
			width: 100%;
			padding: 10px;
			background: #2a2a2a;
			border: 1px solid #444;
			border-radius: 6px;
			color: white;
			box-sizing: border-box;
		}

		button {
			background: #1c7ed6;
			color: white;
			border: none;
			padding: 12px 20px;
			border-radius: 6px;
			cursor: pointer;
			width: 100%;
			font-weight: bold;
			margin-top: 10px;
		}

		button:hover {
			background: #1971c2;
		}

		#chat-box {
			margin-top: 25px;
			border-top: 1px solid #333;
			padding-top: 20px;
			line-height: 1.6;
		}

		.msg {
			margin-bottom: 15px;
			padding: 10px;
			border-radius: 8px;
		}

		.user {
			background: #2c2c2c;
			border-left: 4px solid #1c7ed6;
		}

		.guru {
			background: #252525;
			border-left: 4px solid #40c057;
		}

		.history {
			font-size: 0.8em;
			color: #888;
			font-style: italic;
			margin-bottom: 5px;
		}
	</style>
</head>

<body>
	<div class="container">
		<h1>Fishing Guru AI</h1>
		<form id="chat-form">
			<div class="input-group">
				<label>Where are you fishing?</label>
				<input type="text" id="location" placeholder="e.g. Miami, FL" required>
			</div>
			<div class="input-group">
				<label>What are you catching?</label>
				<input type="text" id="target" placeholder="e.g. Snapper" required>
			</div>
			<button type="submit">Ask the Guru</button>
		</form>

		<div id="chat-box">
		</div>
	</div>

	<script>
		const chatForm = document.getElementById('chat-form');
		const chatBox = document.getElementById('chat-box');

		chatForm.onsubmit = async (e) => {
			e.preventDefault();
			const loc = document.getElementById('location').value;
			const target = document.getElementById('target').value;

			// Clear previous results
			chatBox.innerHTML = '';

			// 1. Create User Message
			const userDiv = document.createElement('div');
			userDiv.className = 'msg user';
			userDiv.innerHTML = `Searching for ${target} in ${loc}...`;
			chatBox.appendChild(userDiv);

			// 2. Create Guru Message Container
			const guruDiv = document.createElement('div');
			guruDiv.className = 'msg guru';
			const historySpan = document.createElement('div');
			historySpan.className = 'history';
			const contentSpan = document.createElement('span');
			guruDiv.appendChild(historySpan);
			guruDiv.appendChild(contentSpan);
			chatBox.appendChild(guruDiv);

			// 3. Kick off the Workflow/Memory API (Background)
			// This stores the history in SQLite
			fetch(`/api/fish?location=${encodeURIComponent(loc)}&target=${encodeURIComponent(target)}`)
				.then(res => res.json())
				.then(data => {
					historySpan.innerText = data.historyNote || '';
				});

			// 4. Start the AI Stream (Foreground)
			const response = await fetch(`/api/chat?q=Give me an expert tip for catching ${target} in ${loc}`);
			const reader = response.body.getReader();
			const decoder = new TextDecoder();

			while (true) {
				const { value, done } = await reader.read();
				if (done) break;

				const chunk = decoder.decode(value, { stream: true });
				const lines = chunk.split('\n');
				for (const line of lines) {
					if (line.startsWith('data: ')) {
						try {
							const data = JSON.parse(line.slice(6));
							contentSpan.innerText += data.response;
						} catch (e) { }
					}
				}
			}
		};
	</script>
</body>

</html>
