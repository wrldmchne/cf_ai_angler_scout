<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Fishing Guru | Local Spot Finder 🎣</title>
	<style>
		body {
			font-family: -apple-system, system-ui, sans-serif;
			background: #121212;
			color: #e0e0e0;
			max-width: 700px;
			margin: 0 auto;
			display: flex;
			flex-direction: column;
			height: 100vh;
		}

		.container {
			flex: 1;
			display: flex;
			flex-direction: column;
			background: #1e1e1e;
			border-left: 1px solid #333;
			border-right: 1px solid #333;
			overflow: hidden;
		}

		header {
			padding: 15px 20px;
			border-bottom: 1px solid #333;
			background: #181818;
			text-align: center;
		}

		h1 {
			color: #4dabf7;
			margin: 0;
			font-size: 1.4rem;
		}

		#chat-box {
			flex: 1;
			overflow-y: auto;
			padding: 20px;
			display: flex;
			flex-direction: column;
			gap: 15px;
			scroll-behavior: smooth;
		}

		.msg {
			padding: 12px 16px;
			border-radius: 12px;
			max-width: 85%;
			line-height: 1.5;
			font-size: 1rem;
		}

		.user {
			background: #1c7ed6;
			color: white;
			align-self: flex-end;
			border-bottom-right-radius: 2px;
		}

		.guru {
			background: #2c2c2c;
			color: #e0e0e0;
			align-self: flex-start;
			border-bottom-left-radius: 2px;
			border: 1px solid #444;
		}

		.memory-note {
			font-size: 0.8rem;
			color: #fab005;
			margin-bottom: 8px;
			font-weight: 600;
			display: block;
			border-bottom: 1px solid #444;
			padding-bottom: 4px;
		}

		#chat-form {
			padding: 20px;
			background: #181818;
			border-top: 1px solid #333;
			display: flex;
			gap: 10px;
		}

		input {
			flex: 1;
			padding: 12px;
			background: #2a2a2a;
			border: 1px solid #444;
			border-radius: 8px;
			color: white;
			outline: none;
			font-size: 1rem;
		}

		input:focus {
			border-color: #1c7ed6;
		}

		button {
			background: #1c7ed6;
			color: white;
			border: none;
			padding: 0 24px;
			border-radius: 8px;
			cursor: pointer;
			font-weight: bold;
		}

		button:hover {
			background: #1971c2;
		}

		button:disabled {
			background: #444;
			opacity: 0.7;
			cursor: not-allowed;
		}

		b {
			color: #40c057;
			font-weight: 700;
		}

		/* Styling for the bolded spots */
	</style>
</head>

<body>
	<div class="container">
		<header>
			<h1>Fishing Guru</h1>
		</header>

		<div id="chat-box">
			<div class="msg guru">Hello! I'm your local guide. Whether you're a beginner or a regular, I'm happy to help
				you find some good spots. What are you looking to catch today?</div>
		</div>

		<form id="chat-form">
			<input type="text" id="user-input" placeholder="e.g. Best spots for Bass in Austin?" required
				autocomplete="off">
			<button type="submit" id="send-btn">Send</button>
		</form>
	</div>

	<script>
		const chatForm = document.getElementById('chat-form');
		const chatBox = document.getElementById('chat-box');
		const userInput = document.getElementById('user-input');
		const sendBtn = document.getElementById('send-btn');

		chatForm.onsubmit = async (e) => {
			e.preventDefault();
			const query = userInput.value.trim();
			if (!query) return;

			// UI State
			userInput.value = '';
			userInput.disabled = true;
			sendBtn.disabled = true;

			// 1. Render User Message
			const userDiv = document.createElement('div');
			userDiv.className = 'msg user';
			userDiv.innerText = query;
			chatBox.appendChild(userDiv);
			chatBox.scrollTop = chatBox.scrollHeight;

			// 2. Prepare Guru Response Container
			const guruDiv = document.createElement('div');
			guruDiv.className = 'msg guru';
			const memorySpan = document.createElement('span');
			memorySpan.className = 'memory-note';
			const contentSpan = document.createElement('span');

			guruDiv.appendChild(memorySpan);
			guruDiv.appendChild(contentSpan);
			chatBox.appendChild(guruDiv);

			try {
				// 3. Trigger Memory/Workflow (Background)
				fetch(`/api/fish?query=${encodeURIComponent(query)}`)
					.then(res => res.json())
					.then(data => {
						if (data.historyNote) memorySpan.innerText = "📍 " + data.historyNote;
					});

				// 4. Handle Streaming Response (Foreground)
				const response = await fetch(`/api/chat?q=${encodeURIComponent(query)}`);
				const reader = response.body.getReader();
				const decoder = new TextDecoder();
				let accumulatedText = "";

				while (true) {
					const { value, done } = await reader.read();
					if (done) break;

					const chunk = decoder.decode(value, { stream: true });
					const lines = chunk.split('\n');

					for (const line of lines) {
						if (line.startsWith('data: ') && !line.includes('[DONE]')) {
							try {
								const data = JSON.parse(line.slice(6));
								if (data && data.response) {
									accumulatedText += data.response;

									// REPLACEMENT LOGIC: 
									// Convert **Spot Name** to <b>Spot Name</b> 
									const formatted = accumulatedText.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
									contentSpan.innerHTML = formatted;

									chatBox.scrollTop = chatBox.scrollHeight;
								}
							} catch (e) { /* Skip partial JSON */ }
						}
					}
				}
			} catch (err) {
				contentSpan.innerText = "I'm having a bit of trouble connecting to the dock right now. Please try again in a moment.";
			} finally {
				userInput.disabled = false;
				sendBtn.disabled = false;
				userInput.focus();
			}
		};
	</script>
</body>

</html>
